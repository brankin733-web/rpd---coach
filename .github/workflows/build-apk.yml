name: Build RPD Coach APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_INTERNAL_TEST_UNLOCK: "true"
      NEXT_PUBLIC_AI_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Restore and unpack production source
        run: |
          base64 --decode rpd-coach-build-source.b64 > rpd-coach-build-source.zip
          unzip -q rpd-coach-build-source.zip -d appsrc
      - name: Apply current RPD source patches
        run: python3 scripts/apply-frame-workflow-patch.py appsrc
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK 36
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        working-directory: appsrc
        run: npm install --no-audit --no-fund
      - name: Verify source and production config
        working-directory: appsrc
        run: |
          npm run typecheck
          npm run lint:release
          npm run test:flow
          npm run test:interactions
          npm run test:v12
          node scripts/release-doctor.mjs --apk
          npm run check:production-env
      - name: Build web app
        working-directory: appsrc
        run: npm run build
      - name: Create Android project
        working-directory: appsrc
        run: npx cap add android && npx cap sync android && npm run android:prepare && npm run android:assets
        env:
          RPD_ANDROID_VERSION_CODE: ${{ github.run_number }}
          RPD_ANDROID_VERSION_NAME: 1.2.0
      - name: Build installable debug APK
        working-directory: appsrc/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpd-coach-install-apk
          path: appsrc/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
