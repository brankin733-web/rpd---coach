name: Build RPD Coach APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore and unpack production source
        run: |
          base64 --decode rpd-coach-build-source.b64 > rpd-coach-build-source.zip
          unzip -q rpd-coach-build-source.zip -d appsrc
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        working-directory: appsrc
        run: npm install --no-audit --no-fund
      - name: Verify source and production config
        working-directory: appsrc
        run: npm run verify && npm run check:production-env
      - name: Build web app
        working-directory: appsrc
        run: npm run build
      - name: Create Android project
        working-directory: appsrc
        run: npx cap add android && npx cap sync android && npm run android:prepare && npm run android:assets
        env:
          RPD_ANDROID_VERSION_CODE: ${{ github.run_number }}
          RPD_ANDROID_VERSION_NAME: 1.0.0
      - name: Build installable debug APK
        working-directory: appsrc/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpd-coach-install-apk
          path: appsrc/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error