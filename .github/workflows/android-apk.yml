name: Build RPD Coach Samsung APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "capacitor.config.ts"
      - "www/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure full-screen Samsung shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/java/com/rpdfootball/coach/MainActivity.java")
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text("""package com.rpdfootball.coach;

          import android.os.Bundle;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.R) {
                      getWindow().setDecorFitsSystemWindows(false);
                      WindowInsetsController controller = getWindow().getInsetsController();
                      if (controller != null) {
                          controller.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                          controller.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                      }
                  } else {
                      getWindow().getDecorView().setSystemUiVisibility(
                          android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
                          android.view.View.SYSTEM_UI_FLAG_FULLSCREEN |
                          android.view.View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                          android.view.View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                          android.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |
                          android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      );
                  }
              }
          }
          """)
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          text = text.replace('android:screenOrientation="portrait"', 'android:screenOrientation="unspecified"')
          manifest.write_text(text)
          PY

      - name: Build installable APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RPD-Coach-1.4.0-Samsung.apk

      - name: Upload Samsung APK
        uses: actions/upload-artifact@v4
        with:
          name: RPD-Coach-1.4.0-Samsung
          path: RPD-Coach-1.4.0-Samsung.apk
          retention-days: 14
          if-no-files-found: error
